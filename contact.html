<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riverwood Garden contact page</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar md:navbar-expand bg-1 >768px">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">Riverwood Garden</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact Us</a>
          </li>
          <li class="nav-item">
            <button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false">
              Menu
            </button>
            <div class="menu">
              <a class="menu-item" href="#">Tab 1</a>
              <a class="menu-item" href="#">Tab 2</a>
              <hr class="menu-divider">
              <a class="menu-item" href="#">Tab 3</a>
            </div>
          </li>
        </ul>
        <form class="hstack gap-2" role="search">
          <input class="form-control" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn-solid btn-icon theme-secondary" type="submit">
            <svg class="bi" width="16" height="16"><use href="#search" /></svg>
          </button>
        </form>
      </div>
    </dialog>
  </div>
</nav>

<main>
<div class="form-field" md:col-6>
  <label for="fieldText" class="form-label">Email address</label>
  <input type="email" class="form-control" id="fieldText" placeholder="name@example.com">
  <div class="form-text">
    Emails will be used to contact you.
  </div>
</div>
<div class="container mt-3">
    <form style="max-width: 900px" class="mx-auto">
<div class="row g-4">
<div class="md:col-6">
<div class="form-field">
  <label for="firstName" class="form-label" md:col-6>First name</label>
<input type="text" class="form-control" id="firstName">
<label for="firstName" class="form-label" md:col-6>Last name</label>
<input type="text" class="form-control" id="lastName">

<label for="firstName" class="form-label" md:col-6>Topic</label>
<select class="form-control" id="topic">
  <option value="topic1">Option 1</option>
  <option value="topic2">Option 2</option>
  <option value="topic3">Option 3</option>
</select>

<label for="firstName" class="form-label" md:col-6>Comments</label>
<input type="text" class="form-control" id="message" placeholder="Write your message here">


<label for="firstName" class="form-label" Checkbox>I agree to be contacted</label>
<input type="checkbox" class="form-check-input" id="Check">

<button class="Contactbtn" btn-solid theme-primary> Contact Us </button>
</form>
</main>

<footer class="foot"> 2026 The Riverwood Conservancy </footer>  
    
</body>
</html>
